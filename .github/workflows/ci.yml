# CI (Wave I): the whole test suite runs offline — every AI piece is
# faked in tests/ — so this needs nothing but Python and pip. No GPU,
# no Ollama, no models, no network beyond installing dependencies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Cancel superseded runs on the same branch/PR so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check .

  test:
    # Two legs per Python version, split by test file (tests/_shard.py: heaviest file to the lightest leg, the ratchets
    # together in leg 1): one leg of the 48,000 tests took 44 to 50 minutes on 3.11 and 3.12 (W24).
    name: Tests (Python ${{ matrix.python-version }}, leg ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Nine tests shell out to `node --check` or to the markdown and export
      # helpers in tests-e2e, and skip themselves when node is missing. On a
      # developer machine that is right; here it meant they had never run at
      # all, on any job, which is the shape of a test that cannot fail (audit
      # A9). No npm install: `node --check` and the helpers need the runtime
      # and nothing else, so this costs a few seconds per matrix leg.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # --durations=0 with a one-second floor names every slow test; the junit file is summed by test file below,
      # so one run shows the whole tail and not only the fifteen slowest (OPEN W24).
      - name: Run the test suite
        run: python -m pytest -n auto --shard ${{ matrix.shard }}/2 --durations=0 --durations-min=1.0 --junitxml=junit.xml

      - name: Test time by file
        if: always()
        run: python scripts/ci_durations.py junit.xml 40 >> "$GITHUB_STEP_SUMMARY"

  test-result:
    # The "Protect Main Branch" ruleset requires "Tests (Python 3.11)", "3.12" and "3.13", the names from before the
    # suite split into two legs (W24). One small job per version carries the old name and passes only when every leg
    # passed (a matrix `needs` waits on all six; a cancelled run skips it rather than failing), so the ruleset needs no edit (the owner, 2026-11-11).
    name: Tests (Python ${{ matrix.python-version }})
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Every leg passed
        run: test "${{ needs.test.result }}" = "success"

  pdf:
    # Fourteen tests need the PDF rasteriser (pypdfium2 plus Pillow), which is
    # an optional extra nobody installs by default, so page images, page
    # captions, the page OCR reads and the region crops were skipped on every
    # run of the job above (audit A9: "tests that never run here"). One job,
    # one Python version, the extra installed, and only the files that are
    # gated on it: the point is that the code runs somewhere on every push,
    # not that the whole suite runs twice.
    name: Tests (PDF extra)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and the PDF extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pypdfium2 Pillow

      - name: The rasteriser is really there
        run: python -c "from tessellate.core import pdfpages; assert pdfpages.available()"

      - name: Run the tests that need it
        run: |
          python -m pytest \
            tests/test_pdfpages.py \
            tests/test_docview.py \
            tests/test_files_describe.py \
            tests/test_media_api.py \
            tests/test_ocr_model.py \
            tests/test_ocr_page.py \
            tests/test_ocr_pdf_regions.py \
            tests/test_ocr_regions.py \
            tests/test_page_captions.py

  e2e:
    # roadmap ANALYSIS.md §31 / ROADMAP.md §38.2: the job above fakes every
    # AI call and never opens a browser, so a clipped tab, an overlapping
    # z-index or a console exception has never once failed a CI run — every
    # layout bug this project has found was found by hand, after shipping.
    # This is the fix: a real headless Chromium against a real running app.
    # Since 2026-10-05 it also drives every main flow the way a person does
    # (capture and filing, search, Ask, notes, documents, boards, import,
    # backup and restore, spaces, the palette) on a seeded notebook and a
    # fresh one, and asserts what is there after a reload: the core flow had
    # been broken under thousands of green unit tests (tests-e2e/specs/,
    # docs/roadmap/agent-remaining/e2e-1005.md). No model: the no-model
    # filing path and the extractive Ask are what is asserted.
    name: E2E flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install Playwright + browser
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the flows
        working-directory: tests-e2e
        env:
          TESSELLATE_E2E_BUDGETS_APART: "1"
        run: npx playwright test

      # The budgets time the app, so they run alone, one worker, nothing else
      # on the runner's cores.
      - name: Run the budgets alone
        working-directory: tests-e2e
        run: npx playwright test specs/budgets.spec.js --project=notebook --workers=1

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 7

  ui-sweeps:
    # The ui sweeps (scratchpad/ui-sweeps) ran only through a local
    # `gate.sh --sweeps`; the steady ones and deepflows.js now run on every
    # push against fresh notebooks (L-general-20). The list is in
    # scripts/ci_sweeps.sh; a repaired sweep joins it (L-ui-modernisation-75).
    name: UI sweeps (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install Playwright + browser
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the sweeps and deepflows
        run: |
          export VENV="$(python -c 'import sys; print(sys.prefix)')"
          export NODE_PATH="$PWD/tests-e2e/node_modules"
          bash scripts/ci_sweeps.sh "$RUNNER_TEMP/ui-sweeps"
