# CodeQL: GitHub's static security analysis. It scans the Python code for
# known vulnerability patterns (injection, unsafe deserialisation, etc.)
# on every push/PR and weekly, and reports findings in the Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  # **No base-branch filter, deliberately.** This read `branches: [main]`, and
  # a pull request's branch filter matches its *base*, so a stacked pull
  # request (one opened against another feature branch rather than against
  # main) was never scanned at all. Measured 2026-09-21: PR #150, whose base
  # is PR #149's branch, had **0 CodeQL runs** against several hundred
  # commits, while `ci.yml`, which carries no such filter, ran on every push
  # to it. The tests were watching and the security scan was not.
  #
  # Scanning every pull request costs one run per PR and removes a silent
  # hole that only appears when work is stacked, which is exactly when a
  # branch is longest-lived and least reviewed.
  pull_request:
  schedule:
    - cron: "27 3 * * 1" # every Monday at 03:27 UTC — catches newly-published rules

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:python"
