# Release: creates a GitHub Release and attaches the Windows installer and
# Linux package whenever a version tag (v*) is pushed — or when run manually
# from the Actions tab, for an environment that can't push a tag directly
# (a fine-grained credential without tag-ref permission, a tag protection
# rule, etc.): softprops/action-gh-release creates the tag itself as part of
# creating the release when given an explicit tag_name, so a git push of the
# tag was never actually required, only convenient.
#
# Not on PyPI, deliberately: this app ships as an installed Windows app via
# GitHub Releases (see BACKLOG.md §7), not as something `pip install`s, so a
# PyPI step would just be one more credential to manage and one more
# irreversible-publish footgun for a feature nobody downstream uses. If that
# ever changes, `pypa/gh-action-pypi-publish` is the action to reach for —
# see this file's git history for the job this replaced.
#
# Prerequisites, tag-push route:
#   git tag v0.1.0 && git push origin v0.1.0
# Prerequisites, manual route: Actions tab -> Release -> Run workflow ->
# enter "0.1.0" (no leading v) in the version box.
# Either way, before releasing: rename CHANGELOG.md's "## [Unreleased]"
# header to the version you're releasing (e.g. "## [0.1.0] - 2026-08-18")
# — the changelog-extraction step below matches on that exact number, and
# an empty match falls back to GitHub's auto-generated notes instead.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (no leading v)"
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve from the tag push or the manual input
        id: resolve
        # The typed version reaches the script as an environment variable,
        # never spliced into its text: `${{ inputs.version }}` inside `run:`
        # is substituted before bash parses it, so a value with a quote and
        # a command in it would run (GitHub's script-injection guidance).
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # The tag must say what the code says: the app reports
          # src/tessellate/__init__.py's __version__ (About, /health, the
          # updater's comparison), and installer.iss stamps the installer
          # with it. A tag that disagrees stops the release here, before
          # anything is built or published, rather than shipping v0.4.0
          # that calls itself 0.3.32 and offers itself as an update forever.
          CODE=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/tessellate/__init__.py)
          if [ "$VERSION" != "$CODE" ]; then
            echo "::error::release version $VERSION does not match __version__ $CODE in src/tessellate/__init__.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  github-release:
    name: Create GitHub Release
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # The section under this version's header, up to the next one. Not
          # an awk range (`/^## x/,/^## /`): its end pattern matches the
          # start line itself, so the range was that one line and the notes
          # were always empty. The header is matched as text, so the dots
          # in a version are not regex wildcards.
          NOTES=$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 || index($0, "## " v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md)
          # A release body is capped at 125,000 characters and the API
          # refuses a longer one, failing the release (0.4.0's section is
          # about 278,000). Cut at a line end under the cap, in bytes, which
          # are never fewer than characters, and point at the full file.
          if [ "$(printf %s "$NOTES" | wc -c)" -gt 120000 ]; then
            NOTES="$(printf %s "$NOTES" | head -c 120000 | sed '$d')

          The full list is in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
          fi
          DELIM="notes_$(date +%s%N)"
          echo "notes<<$DELIM" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          # Only meaningful on the manual-dispatch route — the tag doesn't
          # exist as a ref yet, so it's cut from whatever commit this run
          # itself is on. Ignored (a no-op) when the tag already exists,
          # i.e. the normal tag-push route.
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: ${{ steps.changelog.outputs.notes == '' }}

  build-windows-installer:
    name: Build Windows installer
    # After github-release, not in parallel with it: this job uploads an
    # asset to the release that job creates, via the same action run again
    # with the same tag — softprops/action-gh-release adds to an existing
    # release under that tag rather than making a second one, but only if
    # the release already exists by the time this runs.
    needs: [resolve-version, github-release]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        # The base app's own deps, minus sentence-transformers/torch:
        # Settings -> Packages already treats semantic search as an
        # optional install fetched after the app is running (core/extras.py
        # id="semantic"), same as voice dictation and the desktop window
        # itself — bundling a torch download into the base installer would
        # be inconsistent with that and a few hundred MB for a feature this
        # build already has a working path to install on demand.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" SQLAlchemy alembic python-dotenv \
            requests "certifi>=2026.10.23" numpy "fsspec[http]" bcrypt cryptography \
            python-multipart defusedxml tzdata pywebview pystray Pillow pyinstaller
          pip install -e . --no-deps

      - name: Build the frozen app (PyInstaller)
        shell: bash
        run: |
          pyinstaller packaging/windows/tessellate.spec --distpath dist --workpath build --noconfirm

      # The frozen app has no console (`console=False` in the spec), and the
      # 0.2.x build died at launch because uvicorn's log formatter asked
      # `sys.stderr.isatty()` on None: nothing in this workflow ever ran what
      # it had built. This runs it: the binary must serve its page from a
      # fresh data dir inside a minute, or the release does not happen.
      - name: Smoke test the frozen app
        shell: bash
        env:
          TESSELLATE_DATA_DIR: ${{ runner.temp }}/mm-smoke
          TESSELLATE_PORT: "8765"
        # The same smoke package-check.yml runs (packaging/frozen_smoke.py):
        # every asset, the lazy bundles included, and the API on a fresh
        # data dir. A release that cannot serve one of them does not happen.
        run: |
          "dist/Tessellate/Tessellate.exe" &
          pid=$!
          failed=0
          python packaging/frozen_smoke.py --base http://127.0.0.1:8765 \
            --data-dir "$TESSELLATE_DATA_DIR" --log "$TESSELLATE_DATA_DIR/logs/desktop-stdio.log" || failed=1
          kill $pid || true
          exit $failed

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the .exe installer (Inno Setup)
        shell: pwsh
        env:
          TESSELLATE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $version = (Select-String -Path src\tessellate\__init__.py -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $version) { throw "no __version__ line in src\tessellate\__init__.py" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

      # The MSI ships alongside the .exe, not instead of it (the owner's
      # explicit call): the .exe stays the simplest no-terminal path, the
      # MSI is for `msiexec /quiet`, Group Policy deployment and Windows
      # Installer's own repair/rollback. Unsigned for now, same as the
      # .exe — see installer.wxs's own header for why that is fine to ship.
      #
      # **Off for now** (2026-09-21): WiX Toolset v7's CLI now refuses to
      # build at all without accepting the Open Source Maintenance Fee EULA
      # (WIX7015, https://wixtoolset.org/osmf/), which stopped this release
      # cold and, worse, took the .exe upload down with it below, since a
      # failed step ends the job before "Upload installers" ever runs. The
      # owner: comment the MSI out so the .exe still ships. `if: false` on
      # both WiX steps rather than deleting them, since the fix is either
      # accepting the EULA (a decision, not a workaround) or pinning an
      # older WiX release that predates it, and the commands are exactly
      # what a future session needs to re-enable one of those.
      - name: Install WiX
        if: false
        run: dotnet tool install --global wix

      - name: Build the .msi installer (WiX)
        if: false
        shell: pwsh
        env:
          TESSELLATE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          wix build packaging\windows\installer.wxs -arch x64 `
            -d Version=$env:TESSELLATE_VERSION `
            -d DistDir="dist\Tessellate" `
            -o "dist\installer\Tessellate-$env:TESSELLATE_VERSION-windows-x86_64.msi"

      - name: Upload installers to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          # The .msi line is out with the steps above: a glob with nothing to
          # match fails this action outright, and the .exe alone is a
          # complete, working release either way.
          files: |
            dist/installer/Tessellate-Setup-*.exe

  build-linux-package:
    name: Build Linux package
    # Same reasoning as build-windows-installer: uploads to the release
    # github-release just created, so it has to exist first.
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # pywebview's Linux backend needs GTK/WebKit as system packages —
      # pip alone can't provide them.
      - name: Install GTK/WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install build dependencies
        # Same trimmed set as the Windows job (no sentence-transformers/
        # torch — see that job's own comment) and no pystray/Pillow: this
        # build ships without a system tray, see packaging/linux/
        # tessellate.spec's own comment for why.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" SQLAlchemy alembic python-dotenv \
            requests "certifi>=2026.10.23" numpy "fsspec[http]" bcrypt cryptography \
            python-multipart defusedxml tzdata pywebview pyinstaller
          pip install -e . --no-deps

      - name: Build the frozen app (PyInstaller)
        run: |
          pyinstaller packaging/linux/tessellate.spec --distpath dist --workpath build --noconfirm

      # The frozen app has no console (`console=False` in the spec), and the
      # 0.2.x build died at launch because uvicorn's log formatter asked
      # `sys.stderr.isatty()` on None: nothing in this workflow ever ran what
      # it had built. This runs it: the binary must serve its page from a
      # fresh data dir inside a minute, or the release does not happen.
      - name: Smoke test the frozen app
        shell: bash
        env:
          TESSELLATE_DATA_DIR: ${{ runner.temp }}/mm-smoke
          TESSELLATE_PORT: "8765"
        run: |
          "dist/Tessellate/Tessellate" &
          pid=$!
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/; then
              echo "the frozen app served its page after ${i}s"
              kill $pid || true
              exit 0
            fi
            sleep 1
          done
          echo "the frozen app did not answer within 60 s"
          cat "$TESSELLATE_DATA_DIR/logs/desktop-stdio.log" 2>/dev/null || true
          kill $pid || true
          exit 1

      - name: Pack the build
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        # **A tarball, and it is the one to download.** A zip does not
        # reliably carry the executable bit on Linux: `unzip(1)` restores it
        # from Info-ZIP's extra field, and Python's `zipfile` and several
        # desktop archive managers do not. Measured on a 755 file: `unzip`
        # gives 755, `zipfile.extractall` gives 644, and `tar` gives 755
        # either way. A 644 launcher is a download that cannot be started,
        # with nothing on screen to say why, which is exactly the class of
        # small broken thing that costs a project its credibility.
        #
        # The zip stays beside it for anyone whose habit it already is, and
        # because a zip is the shape Windows users recognise if they land
        # here by mistake.
        run: |
          cd dist
          tar -czf "../Tessellate-${VERSION}-linux-x86_64.tar.gz" "Tessellate"
          zip -qr "../Tessellate-${VERSION}-linux-x86_64.zip" "Tessellate"

      - name: Upload package to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            Tessellate-*-linux-x86_64.tar.gz
            Tessellate-*-linux-x86_64.zip
