# Stale: marks issues and PRs as stale after 30 days of inactivity and
# closes them 7 days later if still no activity. Pinned items are exempt.

name: Stale

on:
  schedule:
    - cron: "0 3 * * 1"  # every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11
        with:
          # Issues
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had
            no activity for 30 days. It will be closed in 7 days unless there
            is new activity. If this is still relevant, please leave a comment!
          close-issue-message: >
            Closing due to inactivity. Feel free to re-open if this becomes
            relevant again.
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,bug,roadmap"

          # Pull requests
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has had no activity for 30 days. It will be closed in 7 days unless
            there is new activity.
          close-pr-message: >
            Closing due to inactivity. Feel free to re-open if this is still
            being worked on.
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned,work-in-progress"

          days-before-stale: 30
          days-before-close: 7

          # Don't close issues that are assigned to someone
          exempt-assignees: true
