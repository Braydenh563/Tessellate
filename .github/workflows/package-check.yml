# Package check: build the frozen Windows app and the installer, and prove
# both work, before release day rather than on it.
#
# release.yml builds and smoke-tests the frozen app only when a version tag
# is pushed, so a packaging break (a new dependency the spec does not know,
# a hidden import, a file the frontend needs and the bundle lacks) was found
# at the moment of shipping. This runs the same build on any pull request
# that touches what the package is made of, weekly on the default branch,
# and on demand. It publishes nothing.
#
# What each step proves, in order (read the step names in the run):
#   1. packaging/frozen_smoke.py: the page, every asset it references and
#      every lazily loaded one (read from app.js's LAZY_MODULES and the other
#      scripts, so it cannot drift), each served with the type the window
#      runs; then search, a stats question answered without a model, the
#      backup exports (the sealed bundle's cryptography included) and the
#      Alembic stamp on a fresh data dir. No traceback in the app's output,
#      and nothing written inside the bundle.
#   2. The wizard's optional-packages step works from the frozen exe:
#      `--install-extras pdfpages,pyodide` borrows the runner's Python for pip,
#      downloads and unpacks Pyodide itself, installs both into the data
#      folder, and the running app then reports them installed and serves
#      the About panel's release notes.
#   3. installer.iss compiles, and stamps itself with __version__.
#   4. An upgrade: the latest published release is installed silently into
#      a path with a space and a non-ASCII letter and writes a note; this
#      build is installed over it with no /DIR (the updater's way); the
#      upgraded app, started with *no* TESSELLATE_DATA_DIR (the Start Menu's
#      way), reports this version, finds the note, has the newest Alembic
#      revision, keeps its notes and log in %APPDATA%\Tessellate and its
#      shortcuts right, holds no stale file, and downloaded no packages.
#   5. The uninstaller removes the install folder whole and the Start Menu
#      entries, and leaves the notes.

name: Package check

on:
  pull_request:
    # Everything the bundle is made of, not a list of the files that once
    # broke it: a new module imported by name, a script moved into a lazy
    # bundle or a migration is as much a packaging change as the spec is,
    # and each went unchecked until a tag while this listed eight files.
    paths:
      - "packaging/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "src/tessellate/**"
      - "frontend/**"
      - "migrations/**"
      - "alembic.ini"
      - ".github/workflows/package-check.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and smoke the frozen Windows app and its installer
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies (the same set release.yml uses)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" SQLAlchemy alembic python-dotenv \
            requests "certifi>=2026.10.23" numpy "fsspec[http]" bcrypt cryptography \
            python-multipart defusedxml tzdata pywebview pystray Pillow pyinstaller
          pip install -e . --no-deps

      - name: Build the frozen app (PyInstaller)
        shell: bash
        run: |
          pyinstaller packaging/windows/tessellate.spec --distpath dist --workpath build --noconfirm

      # packaging/frozen_smoke.py does the checking, so it can be run against
      # any server by hand and its asset list is read from the code: the page,
      # every file index.html references, every file LAZY_MODULES in app.js
      # and the other scripts name (the lazy bundles never appear in
      # index.html), each with the type the window insists on; then the API
      # paths only a frozen build gets wrong (search, a stats question
      # answered without a model, the backup exports, the sealed bundle's
      # cryptography, the Alembic stamp on this fresh data dir). Every
      # failure is a line naming the URL or the endpoint.
      - name: Smoke test, every asset and the API on a fresh data dir
        shell: bash
        env:
          TESSELLATE_DATA_DIR: ${{ runner.temp }}/mm-smoke
          TESSELLATE_PORT: "8765"
        run: |
          find "dist/Tessellate" | sort > "$RUNNER_TEMP/bundle-before.txt"
          "dist/Tessellate/Tessellate.exe" > "$RUNNER_TEMP/smoke-stdio.log" 2>&1 &
          pid=$!
          failed=0
          python packaging/frozen_smoke.py --base http://127.0.0.1:8765 \
            --data-dir "$TESSELLATE_DATA_DIR" --log "$TESSELLATE_DATA_DIR/logs/desktop-stdio.log" || failed=1
          kill $pid || true
          sleep 2
          # A traceback in the app's own output is a failure even when every
          # request answered: it is what a support bundle would show first.
          # packaging/traceback_check.py skips a traceback named in
          # packaging/benign_tracebacks.txt (empty today) and fails the rest.
          python packaging/traceback_check.py "$RUNNER_TEMP/smoke-stdio.log" "$TESSELLATE_DATA_DIR/logs/desktop-stdio.log" || failed=1
          # The running app must not write inside its own bundle: the
          # uninstaller removes only what it installed, and a per-machine
          # install folder is read-only to the person anyway.
          find "dist/Tessellate" | sort > "$RUNNER_TEMP/bundle-after.txt"
          written=$(comm -13 "$RUNNER_TEMP/bundle-before.txt" "$RUNNER_TEMP/bundle-after.txt" | head -10)
          if [ -n "$written" ]; then echo "FAIL the app wrote into its own folder:"; echo "$written"; failed=1; fi
          exit $failed

      # What the wizard's optional-packages page runs after copying the app
      # (installer.iss [Run]). The frozen exe has no pip of its own; it must
      # find the runner's Python (setup-python put one on PATH), install
      # wheels for its own interpreter into the data folder, and exit 0.
      # pypdfium2 (the pdfpages extra) because it pulls compiled wheels
      # (pypdfium2, Pillow); python-docx went with Brief 42 (Word is written
      # in the browser).
      # Pyodide is the other kind of extra: no pip at all, a pinned download
      # the app fetches, checks against its sha256 and unpacks (tar.bz2) by
      # itself, which proves the frozen build's TLS certificates, bz2 and
      # tarfile, and is 7 MB.
      - name: The frozen exe installs two optional packages (--install-extras pdfpages,pyodide)
        shell: pwsh
        env:
          TESSELLATE_DATA_DIR: ${{ runner.temp }}\mm-extras
        run: |
          $exe = Join-Path $PWD "dist\Tessellate\Tessellate.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--install-extras","pdfpages,pyodide" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          Get-ChildItem "$env:TESSELLATE_DATA_DIR\python-extras" -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          $log = "$env:TESSELLATE_DATA_DIR\logs\desktop-stdio.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "--install-extras pdfpages,pyodide exited $($p.ExitCode)" }
          $pdfium = Get-ChildItem "$env:TESSELLATE_DATA_DIR\python-extras\*\pypdfium2\__init__.py" -ErrorAction SilentlyContinue
          if (-not $pdfium) { throw "pypdfium2 is not in the data folder's python-extras" }
          if (-not (Test-Path "$env:TESSELLATE_DATA_DIR\extras\pyodide\pyodide.asm.wasm")) { throw "Pyodide is not in the data folder's extras" }

      - name: The running app sees the package and its release notes
        shell: bash
        env:
          TESSELLATE_DATA_DIR: ${{ runner.temp }}/mm-extras
          TESSELLATE_PORT: "8766"
        run: |
          "dist/Tessellate/Tessellate.exe" &
          pid=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8766/health && break
            sleep 1
          done
          token=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"password":"testpassword123"}' http://127.0.0.1:8766/auth/setup \
            | python -c "import json,sys; print(json.load(sys.stdin)['token'])")
          failed=0
          curl -sf -H "X-Auth-Token: ${token}" http://127.0.0.1:8766/extras > extras.json || failed=1
          python -c "import json; rows={r['id']: r for r in json.load(open('extras.json', encoding='utf-8'))['extras']}; assert rows['pdfpages']['installed'], rows['pdfpages']; assert rows['pyodide']['installed'], rows['pyodide']; print('pdfpages and pyodide installed')" || failed=1
          curl -sf -H "X-Auth-Token: ${token}" http://127.0.0.1:8766/changelog > changelog.json || failed=1
          python -c "import json; md=json.load(open('changelog.json', encoding='utf-8'))['markdown']; assert len(md) > 1000, len(md); print('changelog chars:', len(md))" || failed=1
          # The Remove button on a packaged build (extras._remove_from_frozen_target).
          curl -sf -X POST -H "X-Auth-Token: ${token}" http://127.0.0.1:8766/extras/pdfpages/uninstall > /dev/null || failed=1
          for i in $(seq 1 30); do
            curl -sf -H "X-Auth-Token: ${token}" http://127.0.0.1:8766/extras > extras.json
            python -c "import json,sys; sys.exit(0 if not json.load(open('extras.json', encoding='utf-8'))['running'] else 1)" && break
            sleep 1
          done
          python -c "import json; d=json.load(open('extras.json', encoding='utf-8')); print('remove:', d['outcome'], d['step']); assert d['outcome'] == 'completed', d" || failed=1
          ls "$TESSELLATE_DATA_DIR"/python-extras/*/pypdfium2 2>/dev/null && { echo "pypdfium2 is still on disk after Remove"; failed=1; }
          kill $pid || true
          exit $failed

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # No TESSELLATE_VERSION: the version is read from __version__ here and
      # passed in, and the file name proves installer.iss used it.
      - name: Build the .exe installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path src\tessellate\__init__.py -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $version) { throw "no __version__ line in src\tessellate\__init__.py" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          $want = "dist\installer\Tessellate-Setup-$version-windows-x86_64.exe"
          if (-not (Test-Path $want)) {
            Get-ChildItem dist\installer | Format-Table Name
            throw "the installer is not stamped with __version__ $version (expected $want)"
          }

      # **An upgrade is how most people meet a new build**: the in-app updater
      # runs this installer with /VERYSILENT over the one already there. So
      # the latest published release goes in first, into a folder whose path
      # has a space and a non-ASCII letter (a username like "José" puts both
      # in every per-user path), and writes a note.
      # A fork, or a repository that has published nothing yet, has no
      # installer to upgrade from: that skips the three steps below with a
      # notice. The upstream repository must have one, so there it stays a
      # loud failure.
      - name: Find the previous release
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub answers now and then with an HTML error page; three tries
          # keep one blip from failing the build.
          foreach ($try in 1..3) {
            $count = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq 'length'
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (5 * $try)
          }
          if ($LASTEXITCODE -ne 0) { throw "could not list this repository's releases" }
          if ($count -eq "0" -and $env:GITHUB_REPOSITORY -ne "Braydenh563/Tessellate") {
            Write-Host "::notice::This repository has no published release, so the upgrade check is skipped."
            "found=false" >> $env:GITHUB_OUTPUT
          } else {
            # A release published before the rename carries the old installer
            # name: there is nothing to upgrade from, so the check waits for
            # the first release that has a Tessellate-Setup installer.
            $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName'
            $named = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '[.assets[].name | select(startswith("Tessellate-Setup-"))] | length'
            if ($named -eq "0") {
              Write-Host "::notice::The latest release ($tag) predates the rename and has no Tessellate-Setup installer, so the upgrade check is skipped."
              "found=false" >> $env:GITHUB_OUTPUT
            } else {
              "found=true" >> $env:GITHUB_OUTPUT
            }
          }

      - name: Install the previous release and write a note in it
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:TESSELLATE_DATA_DIR -ErrorAction SilentlyContinue
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "Tessellate-Setup-*-windows-x86_64.exe" --dir previous
          if ($LASTEXITCODE -ne 0) { throw "could not download the latest release's installer" }
          $setup = Get-ChildItem "previous\Tessellate-Setup-*.exe" | Select-Object -First 1
          Write-Host "previous release: $($setup.Name)"
          $dir = Join-Path $env:RUNNER_TEMP "Tessellate Jos$([char]0x00E9) test"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the previous release's setup exited $($p.ExitCode)" }
          $exe = Join-Path $dir "Tessellate.exe"
          if (-not (Test-Path $exe)) { throw "the previous release did not install into $dir" }
          $env:TESSELLATE_PORT = "8768"
          $app = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
          python packaging/frozen_smoke.py --base http://127.0.0.1:8768 --seed
          $seeded = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          if ($seeded -ne 0) { throw "could not write a note in the previous release" }

      # This build over it, silently and with no /DIR, as the updater runs it:
      # the installer has to find the previous install by itself. The
      # upgraded app is started with no TESSELLATE_DATA_DIR, as the Start Menu
      # starts it, and must report this version, find the note, have brought
      # the database to the newest Alembic revision, keep its notes and log
      # in %APPDATA%\Tessellate, and hold no file the previous release had
      # and this build does not ([InstallDelete] in installer.iss).
      - name: Upgrade over it, and the note, the version and the schema are right
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:TESSELLATE_DATA_DIR -ErrorAction SilentlyContinue
          $version = (Select-String -Path src\tessellate\__init__.py -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $setup = "dist\installer\Tessellate-Setup-$version-windows-x86_64.exe"
          $dir = Join-Path $env:RUNNER_TEMP "Tessellate Jos$([char]0x00E9) test"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $exe = Join-Path $dir "Tessellate.exe"
          if (-not (Test-Path $exe)) { throw "the upgrade did not go into the previous install folder $dir" }

          $bundle = Join-Path $PWD "dist\Tessellate"
          $stale = Get-ChildItem $dir -Recurse -File | ForEach-Object { $_.FullName.Substring($dir.Length + 1) } |
            Where-Object { $_ -notlike "unins000.*" -and -not (Test-Path -LiteralPath (Join-Path $bundle $_)) }
          if ($stale) {
            $stale | Select-Object -First 20 | ForEach-Object { Write-Host "stale: $_" }
            throw "the upgrade left files from the previous release in $dir"
          }

          $programs = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($pair in @(@("Tessellate.lnk", "--desktop"), @("Tessellate\Repair Tessellate.lnk", "--desktop --reinstall"))) {
            $lnk = Join-Path $programs $pair[0]
            if (-not (Test-Path $lnk)) { throw "no Start Menu shortcut $lnk" }
            $link = $shell.CreateShortcut($lnk)
            if ($link.TargetPath -ne $exe -or $link.Arguments -ne $pair[1]) {
              throw "the shortcut $lnk runs '$($link.TargetPath)' '$($link.Arguments)', expected '$exe' '$($pair[1])'"
            }
          }
          $data = Join-Path $env:APPDATA "Tessellate"
          $env:TESSELLATE_PORT = "8767"
          $app = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
          python packaging/frozen_smoke.py --base http://127.0.0.1:8767 --only api --expect-note --data-dir "$data" --log (Join-Path $data "logs\desktop-stdio.log")
          $smoke = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if ($smoke -ne 0) { throw "the upgraded app failed the API smoke (the FAIL lines above name each endpoint)" }
          if (-not (Test-Path (Join-Path $data "logs\desktop-stdio.log"))) { throw "the windowed log is not beside the notes" }
          if (Test-Path (Join-Path $env:RUNNER_TEMP "data")) { throw "the app wrote a data folder into its working directory" }
          if (Get-ChildItem (Join-Path $data "python-extras") -Recurse -Filter "__init__.py" -ErrorAction SilentlyContinue) {
            throw "a silent install downloaded packages nobody asked for"
          }

      - name: Uninstall, and the program goes whole and the notes stay
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "Tessellate Jos$([char]0x00E9) test"
          $data = Join-Path $env:APPDATA "Tessellate"
          Start-Sleep 2
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # The uninstaller hands off to a copy of itself in %TEMP% and
          # returns at once, so wait for the folder to actually go.
          foreach ($i in 1..60) { if (-not (Test-Path $dir)) { break }; Start-Sleep 1 }
          if (Test-Path $dir) {
            Get-ChildItem $dir -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host "left: $($_.FullName)" }
            throw "the uninstaller left the install folder $dir behind"
          }
          $programs = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          foreach ($left in @("Tessellate.lnk", "Tessellate", "MemoryMap AI.lnk", "MemoryMap AI")) {  # brand: keep
            if (Test-Path (Join-Path $programs $left)) { throw "the uninstaller left the Start Menu entry $left" }
          }
          if (-not ((Test-Path (Join-Path $data "tessellate.db")) -or (Test-Path (Join-Path $data "memorymap.db")))) { throw "the uninstaller deleted the notebook" }  # brand: keep
          Write-Host "uninstalled: $dir is gone, the notebook in $data stayed"
