name: Complexity
on:
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml"]
  pull_request:
    paths: ["src/**", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity:
    name: Complexity and perf scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff radon

      #: Performance rules fail the job (there are none to start with, so the
      #: baseline is zero and can only stay there). Complexity is gated by
      #: tests/test_complexity.py against complexity_seed.json, which only
      #: shrinks; ruff's own C901 count is printed here for the reading.
      - name: Ruff performance rules (fail on any)
        run: ruff check src --select PERF --output-format=github

      - name: Ruff complexity (gated by tests/test_complexity.py)
        run: ruff check src --select C901 --config "lint.mccabe.max-complexity = 15" --output-format=github --exit-zero

      - name: Radon summary
        run: |
          {
            echo "## Complexity report"
            echo "### Functions ranked C or worse"
            echo '```'
            radon cc src -s -n C --exclude "src/tessellate/vendor/*" || true
            echo '```'
            echo "### Average complexity"
            echo '```'
            radon cc src -a --exclude "src/tessellate/vendor/*" | tail -n 2
            echo '```'
            echo "### Files with weak maintainability"
            echo '```'
            radon mi src -n B -s --exclude "src/tessellate/vendor/*" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
