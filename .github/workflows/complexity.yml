name: Complexity
on:
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml"]
  pull_request:
    paths: ["src/**", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity:
    name: Complexity and perf scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff radon

      # Q20: fails on a new finding. BASELINE is the count on 2026-11-12 (0 since L812; 9 earlier on 11-12, 14 on 11-11);
      # it only goes down: lower it in the commit that fixes one.
      - name: Ruff complexity and performance rules (ratchet)
        env:
          BASELINE: "0"
        run: |
          ruff check src --select C901,PERF --config "lint.mccabe.max-complexity = 15" --output-format=github --exit-zero
          found=$(ruff check src --select C901,PERF --config "lint.mccabe.max-complexity = 15" --output-format=concise --exit-zero | grep -cE ' (C901|PERF[0-9]+) ' || true)
          echo "complexity and perf findings: $found (baseline $BASELINE)"
          if [ "$found" -gt "$BASELINE" ]; then echo "::error::$found findings, baseline $BASELINE: fix the new one"; exit 1; fi

      - name: Radon summary
        run: |
          {
            echo "## Complexity report"
            echo "### Functions ranked C or worse"
            echo '```'
            radon cc src -s -n C --exclude "src/tessellate/vendor/*" || true
            echo '```'
            echo "### Average complexity"
            echo '```'
            radon cc src -a --exclude "src/tessellate/vendor/*" | tail -n 2
            echo '```'
            echo "### Files with weak maintainability"
            echo '```'
            radon mi src -n B -s --exclude "src/tessellate/vendor/*" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
