name: Workflow lint
# The workflows themselves are supply chain (L-general-2): actionlint checks
# their syntax and expressions, zizmor their security (unpinned actions,
# persisted credentials, template injection, permissions).
on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install actionlint-py==1.7.12.24 zizmor==1.31.1
      - name: actionlint
        run: actionlint -shellcheck= .github/workflows/*.yml
      - name: zizmor
        run: zizmor --offline --min-severity medium .github/workflows
