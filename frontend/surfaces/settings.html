

          <!-- Models -->

                <p>
                  The second option covers any server speaking the OpenAI API:
                  LM Studio, llama.cpp's server, Jan and vLLM are all the same
                  choice, differing only by address. Leave the address blank for
                  the usual one (Ollama <code>:11434</code>, LM&nbsp;Studio

                <button id="llm-provider-apply" class="small">Connect</button>

              <!-- The long version moved into #backend-help above; one short

                <span>
                  Keep Atlas on this machine

                    Recommended, and on by default. Refuses any model backend

            <div id="models-config" class="hidden settings-group">

                   value) or a number, sent on every request".

              <div class="row align-center" id="model-context-row">
                <label for="model-context-window">Context window</label>
                <input type="number" id="model-context-window" min="0" step="1024"

                <button type="button" class="icon-only ghost small graph-help-toggle"

                  <i class="ph ph-question" aria-hidden="true"></i>

              <div class="help-body hidden" id="model-context-help" role="dialog" aria-label="About the context window">
                <p>
                  The context window is how much of your conversation and notes
                  the model can hold at once, counted in tokens. Empty means
                  auto: the app uses the model's own window, held back only by
                  how much free memory the cache for that window would need.
                  With llama.cpp the server sets the window when it loads the
                  model, so the app follows the number it reports.
                </p>
                <p>
                  Set a number when you know better than the file does, for
                  example when you started llama.cpp with a larger window, or
                  when you want to hold a big model to a smaller one so it
                  loads faster and uses less memory. The setting is remembered
                  per model, so a small model and a large one can differ.
                </p>
              </div>
              <div class="row help-head">
                <h3>Utility model</h3>
                <button type="button" class="icon-only ghost small graph-help-toggle"

                  title="About the utility model" aria-label="About the utility model">
                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>

              <div class="row">

                <button id="utility-model-apply" class="ghost small">Use this model</button>

              <p id="utility-model-note" class="muted" aria-live="polite"></p>
              <div class="stack-top-gap">
                <label class="checkbox-label row align-center">

                  <span>Use smart model routing for background jobs</span>

              <p class="muted">On: filing, the weekly digest, tidy suggestions and writing fixes run on the utility model. Off: they run on the chat model.</p>
              <div class="help-body hidden" id="utility-model-help" role="dialog" aria-label="About the utility model">
                <p>
                  Quick background jobs run on this model, so a big slow

              </div>
              <!-- Vision-capable models (ROADMAP.md's largest open item).

              <div class="row help-head">
                <h3>Vision model</h3>

                  title="About the vision model" aria-label="About the vision model">
                  <i class="ph ph-question" aria-hidden="true"></i>

              </div>

                <button id="vision-model-apply" class="ghost small">Use this model</button>
              </div>
              <p id="vision-model-note" class="status"></p>
              <p class="muted">Used for images in chat. Auto-detect picks one that can see.</p>
              <div class="help-body hidden" id="vision-model-help" role="dialog" aria-label="About the vision model">
                <p>
                  “Auto-detect” uses the first installed model that reports

              <!-- Separate from the vision model above, and the reason is not
                   obvious: rasterising a PDF does not read anything, it turns
                   a page into a picture, and a model still has to read the
                   picture. So both jobs take an image, but a general vision
                   model is trained to say what is *in* one, while a document
                   reader is trained to return the text, tables and layout. Ask
                   moondream for a scanned invoice and it describes the
                   invoice. -->
              <div class="row help-head">
                <h3>Reading text</h3>
                <button type="button" class="icon-only ghost small graph-help-toggle"

                  title="About reading text" aria-label="About reading text">
                  <i class="ph ph-question" aria-hidden="true"></i>

              </div>
              <div class="row">
                <select id="ocr-model-select" aria-label="Model used to read text off a page" title="Model used to read text off a page"></select>
                <button id="ocr-model-apply" class="ghost small">Use this model</button>
              </div>
              <p id="ocr-model-note" class="status"></p>
              <p class="muted">OCR for scanned PDFs and text in images. Automatic prefers a dedicated reader.</p>
              <div class="help-body hidden" id="ocr-model-help" role="dialog" aria-label="About reading text">
                <p>
                  Left on “Automatic”, this prefers a document reader
                  (GLM-OCR, DeepSeek-OCR, PaddleOCR-VL) when you have one

            <!-- **Outside #models-config** (WORLD_CLASS_PLAN 20, built):

            <div id="feature-models-config" class="settings-group">

                   The rows are built in app.js from `/models/status`'s

              <div class="row help-head">
                <h3>Model per feature</h3>
                <button type="button" class="icon-only ghost small graph-help-toggle"

                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>
              </div>

              <div id="feature-models-list" class="feature-models"></div>

                 Ollama reports them in /api/show, so every row starts at what
                 the model itself asks for and says so. Changing one stores

            <div class="fold-help-wrap">

              <div class="help-body hidden" id="sampling-help" role="dialog" aria-label="About these settings">

              <p id="sampling-note" class="muted text-sm"></p>

            </div>
            <div id="installed-box" class="hidden settings-group">

              <div id="installed-list" class="model-grid"></div>
            </div>
            <!-- The model bench (WORLD_CLASS_PLAN I8, H3): ai/bench.py runs the

            <div id="bench-box" class="hidden settings-group">
              <div class="row help-head">
                <h3>Test my models</h3>
                <button type="button" class="icon-only ghost small graph-help-toggle"
                  data-help-for="bench-help" aria-controls="bench-help" aria-expanded="false"
                  title="About the model bench" aria-label="About the model bench">
                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>
              </div>

              <div class="help-body hidden" id="bench-help" role="dialog" aria-label="About the model bench">
                <p>
                  Each model files a sample of your notes, answers a question

                  search tool five times. Filing is right when it picks the
                  category you chose; an answer is right when it names the note

                </p>
                <p>

            <!-- Suggested downloads as model cards (INBOX 444): grouped by what
                 the model is for, one starting pick per group, each card saying
                 what it needs and whether it fits this computer, with its own
                 progress and Cancel. Built by `renderSuggested`

            <div id="suggested-box" class="hidden settings-group">

                <h3>Suggested downloads</h3>

                <button type="button" id="suggested-hardware-edit" class="ghost small hidden"
                  aria-expanded="false" aria-controls="suggested-hardware-form"
                  title="Correct the memory and graphics card this page detected">Edit</button>
              </div>
              <form id="suggested-hardware-form" class="row hidden" autocomplete="off">
                <label>Memory (GB)
                  <input type="number" id="hardware-ram" min="1" max="4096" step="0.5" inputmode="decimal">
                </label>
                <label>Video memory (GB)
                  <input type="number" id="hardware-vram" min="0" max="4096" step="0.5" inputmode="decimal"
                    placeholder="0 for none">
                </label>
                <button type="submit" class="ghost small">Save</button>
                <button type="button" id="hardware-reset" class="ghost small">Use detected</button>
                <button type="button" id="hardware-cancel" class="ghost small">Cancel</button>
              </form>
              <div class="help-body hidden" id="suggested-help" role="dialog" aria-label="About these downloads">
                <p>
                  Each card says how much memory the model asks for and whether
                  that fits this computer: Fits is under 60% of its memory,
                  Tight is up to 85%, and Too big is more than that. A graphics
                  card whose own memory holds the model counts instead of the
                  system memory, and memory that is free only right now can
                  take a Fits down to Tight. The line above the cards shows
                  what was detected; Edit corrects it when it is wrong. With
                  Ollama not running the cards still show what fits; Download
                  waits until it is installed and started.
                </p>
                <p>
                  Sizes with a ~ are the download size we shipped and have not
                  checked; they turn exact once the model is installed. The
                  starting pick in each group is ours, chosen for being small
                  and dependable, not the result of a benchmark.

            <div id="search-engine-config" class="settings-group" data-this-computer>
              <div class="row help-head">
                <h3>Search engine</h3>
                <button type="button" class="icon-only ghost small graph-help-toggle"
                  data-help-for="search-engine-help" aria-controls="search-engine-help" aria-expanded="false"
                  title="About the search engine" aria-label="About the search engine">
                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>

              <div class="help-body hidden" id="search-engine-help" role="dialog" aria-label="About the search engine">
                <p>
                  Pick a dedicated <strong>embedding</strong> model (e.g.
                  nomic-embed-text): chat models can't create embeddings.
                  Changing this re-reads every note so search keeps making
                  sense. It runs in the background (Settings, Background
                  tasks shows it, with Stop) and search keeps using the
                  current model until the new one has read every note.
                </p>
                <p>
                  Embedding models lists the choices with their size,

          <section class="settings-section hidden" id="settings-learned">

              </div>

            <div class="help-body hidden" id="learned-help" role="dialog" aria-label="About what it learned">
              <p>
                "What it remembers" is what you told it. This is what it
                worked out by itself while reading your notes: a claim it
                thinks a note makes, a question it thinks a note leaves open.
                Every row says which note it came from, which model decided
                it and how sure it was.

              <p>
                A model that is wrong quietly is worse than no model, so all
                of it is yours: edit a row and no later run overwrites it,
                delete one and the same thing is never worked out again, or
                switch the whole thing off and keep your notes exactly as
                they are.

                sentence you marked wrong, a repeat. It flags, and keeps, what
                needs your eye: two notes that disagree, a date that has passed.

                each background pass, unless the switch above is off.

                another category, a suggestion dismissed) and how many of the
                notes it filed itself you left where it put them: the older
                half of the last 200 against the newer half, so you can see
                whether your moves taught it anything.

                  not do what it said and up to two rewrites. Each of those
                  starts with a fresh allowance of tool-calling rounds, so a
                  run that goes wrong does not loop, it grinds. The budget is
                  what ends that. A run that reaches it stops between rounds,
                  says so, and shows what it changed with a way to put it back.
                  Set either to 0 for no limit.

                <p>

                  times it. There is no time limit out of the box: a local
                  model is slow, and slow is not the same as wrong. A

                  another program's tools. This snippet starts Tessellate's tool

                  prompts. Risky changes such as deleting are never offered to

              <div class="help-body hidden" id="motion-help" role="dialog" aria-label="About motion">
                <p>
                  Motion has three choices. Follow the system (the default)
                  stills the large movement, Atlas, the background art, the
                  graph's layout and the whiteboard, when your browser or
                  system asks for reduced motion. Always on keeps it moving
                  whatever they ask, for a browser that asks for calm by
                  default. Off stills it whatever they say.
                </p>
                <p>
                  Interface animations are the short ones that say what
                  happened: a button pressing in, a menu or dialog opening from
                  where you clicked, a chevron turning, a tab's marker sliding
                  to the new tab, a list settling, a toast arriving. They are
                  on by default and play even when Motion is off, except two
                  flourishes that Motion off stills: a menu's small spring and
                  its first rows arriving in turn, and a plus that turns into
                  a minus. Turn Interface animations off and every one of them
                  is instant.
                </p>
                <p>
                  The app's logo answers both: its top cell settles into place
                  once, then breathes slowly, and its cells lift in turn while
                  Atlas works. Motion off, or Interface animations off, holds
                  it still.
                </p>
                <p>
                  Reveal replies is one of them: a reply written with no model
                  (from your notes, or the Guide's own help) rises into place a
                  block at a time in Chat, Ask, the popup agent and the Guide.
                  Motion off makes it a quick fade; Reveal replies off, it simply appears.
                </p>

                <p>
                  While the desktop app runs, your companion (Appearance picks who; Atlas if none) is on your
                  desktop while the window is minimised or in the tray, and goes away when
                  the window is open. On Windows and Linux Atlas floats like a wind spirit across the screen (other

                  thrown (it bounces off the screen edges), hangs from the top now and then, and peeks up from
                  behind the taskbar or a screen edge (the taskbar on any side), or tucks behind a smaller window. Drag a window from under it and it is thrown off with a flail, then looks worried or miffed; a slipping hold may scrabble and pull up. Let go gently near the top or a title bar and it hangs, then pulls itself up, swings down or lets go with a start; it also hangs from a maximised title bar or a window's bottom edge (Roam over windows turns that off). It stays where it is for minutes, alive in place (it breathes, blinks, also sitting, and sways its tail, and the window never bobs), and spends minutes at a time on one quiet thing for the hour (tea, a book, a journal, dinner, knitting, fishing, the stars, a nap under a blanket, a plant), moving between them by sparkles, a small cloud, a bubble or a portal. A thrown one tumbles smoothly and rights itself as it settles. Only a hard throw up catches the top; any other throw bounces off it, and the hardest leaves through the top and falls back in, later the harder you threw. A longer trip is walking, running (gliding or swooping when it floats), with a jump between window tops, out at one edge and in at the other, through a portal, now and then a puff of smoke, and it steps out of the way of the text you are typing in, or off the bottom of the window you are typing in when the app shows no caret. A spot you drop it in the middle of the screen is moved to an edge after a couple of minutes. Now and then it climbs onto the top of a window and walks along it (never
                  moving the window; Roam over windows in its right-click menu turns that off), and it brings
                  you a card when a reminder falls due. It follows Companion movement
                  in Appearance, and stands still when that is Fades only or Windows animation effects
                  are off; right-click it to see why and choose Let it walk. Click it for Quick note, Quick search, New reminder, Open today or Open
                  Tessellate, and Wave, Come here, Go somewhere else, Take a nap, Sit on a window or Hide for 10 minutes (Come here: it follows your pointer for a while);
                  right-click for Companion (Atlas masculine or feminine, your own or a saved one, summoned once), Stay here or Roam, Activity, Settings or Turn off; a setting keeps the menu open with its new tick. The panel closes when you click
                  elsewhere, and follows it if you move it.
                  While Tessellate is locked it shows the companion and Open only.
                  On Linux (X11) it is the same figure in a see-through window; on Wayland, which cannot place a window above others, it stays in the app. It also lounges, meditates with its eyes shut, sits on a window top with its legs over the edge, lets one hand go in a long hang, answers a pat and glances at new windows, never while you type.

                  Things Tessellate can do with one more package installed.

                <p>

                  package has an Open Packages button that brings you to
                  that package's row. How an install went, and pip's log,

          <template data-surface="settings-websearch">
            <div class="dock settings-pane-title" data-dock-name="settings-websearch">
              <div class="dock-identity"><h3>Web search</h3></div>
              <div class="dock-actions">
                <button type="button" class="icon-only ghost small graph-help-toggle"

                  title="About web search" aria-label="About web search">
                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <p class="muted">The one part of Tessellate that goes online, and it is off by default.</p>
            <div class="help-body hidden" id="websearch-help" role="dialog" aria-label="About web search">
              <p>
                This is the one part of Tessellate that goes online. It is
                off until you turn it on, and even then only your search
                words leave this computer: never your notes.
              </p>
              <ul>
                <li>The request looks like an ordinary browser's and never
                  names Tessellate.</li>
                <li>No cookies are kept between searches, so one search
                  cannot be joined to the next.</li>
                <li>Your words are sent in the body of the request, not in
                  the web address, so they stay out of access logs.</li>
                <li>Tracking parameters are stripped from every result
                  address before you see it.</li>
                <li>With your own SearXNG instance the words stay on your
                  network and no third party sees them at all.</li>
              </ul>
              <p>The full model is in docs/PRIVACY.md.</p>
            </div>

            <div class="settings-group">
            <h3>Let Atlas search the web</h3>

            </label>

            <p class="muted">Kept on this computer only, never sent anywhere.
              <button type="button" class="ghost small" id="web-store-clear">Clear kept pages</button></p>

            </div>

            <div class="settings-group" data-this-computer>
            <div class="row help-head">
              <h3>Your SearXNG instance</h3>
              <button type="button" class="icon-only ghost small graph-help-toggle"
                data-help-for="searxng-help" aria-controls="searxng-help" aria-expanded="false"
                title="About SearXNG" aria-label="About SearXNG">
                <i class="ph ph-question" aria-hidden="true"></i>
              </button>
            </div>
            <div class="row field-row">
              <label for="pref-searxng" class="muted">Address</label>
              <input id="pref-searxng" type="text" maxlength="200"
                placeholder="http://localhost:8888">
              <button id="searxng-detect" class="ghost small"
                title="Look for a SearXNG on the usual local ports"><i class="ph ph-magnifying-glass ph-lead" aria-hidden="true"></i> Auto-detect</button>
            </div>
            <p id="searxng-status" class="status" role="status"></p>
            <p class="muted"><strong>SearXNG is the recommended way to search.</strong> It gives better results, and the query never leaves your own network.</p>
            <div class="help-body hidden" id="searxng-help" role="dialog" aria-label="About SearXNG">
              <p>
                <strong>SearXNG is the recommended way to search.</strong> It
                is a self-hosted search engine that Tessellate can install
                and run for you in one click, you don't need Docker, an
                account, or any setup of your own. It gives better results
                than scraping DuckDuckGo, it can't be rate-limited the way
                scraping can, and the query never leaves your own network.
                It has to be on this machine or your own network, Tessellate
                won't send searches to somebody else's instance, and the
                one it runs for you listens on <code>127.0.0.1</code> only.
              </p>
            </div>
            <div class="searxng-host" data-this-computer>
              <div class="row space-between">
                <span class="row help-head">
                  <strong>Let Tessellate run SearXNG</strong>
                  <button type="button" class="icon-only ghost small graph-help-toggle"
                    data-help-for="searxng-host-help" aria-controls="searxng-host-help" aria-expanded="false"
                    title="About running SearXNG" aria-label="About running SearXNG">
                    <i class="ph ph-question" aria-hidden="true"></i>
                  </button>
                </span>
                <span id="searxng-host-state" class="chip item-label">Checking…</span>
              </div>
              <p class="muted">SearXNG is set up for you, so there is nothing to edit.</p>
              <div class="help-body hidden" id="searxng-host-help" role="dialog" aria-label="About running SearXNG">
                <p>
                  Tessellate can start and stop SearXNG for you and sets it up
                  itself, so there's nothing to edit. While it runs the badge
                  says Running, the card names the port, and Stop is the
                  button to press. The steps for running it yourself are at
                  the foot of this card.
                </p>
              </div>
              <p class="muted" id="searxng-backend"></p>
              <!-- Answers "is the port free?" instead of telling people to go
                   and check, which was the only advice a failed start had. -->
              <p class="muted" id="searxng-port"></p>
              <!-- Buttons on their own row, status underneath. They shared one
                   flex row before, and the status text ("Installed and ready: 
                   press Start SearXNG.") is long, does not shrink and took
                   339px of it: the three buttons were squeezed until their
                   labels wrapped, and measured out at three different heights
                   in the same row, 95x61, 59x43 and 107x28. That is what
                   "ui elements are different heights and everything is
                   squashed together" was, and it is a layout fault, not a
                   button one, so it is fixed by giving the status line its own
                   row rather than by pinning heights. -->
              <div class="row button-row">
                <button id="searxng-start" class="small"><i class="ph ph-play ph-lead" aria-hidden="true"></i> Start SearXNG</button>
                <button id="searxng-stop" class="ghost small"><i class="ph ph-stop ph-lead" aria-hidden="true"></i> Stop</button>
                <button id="searxng-reinstall" class="ghost small"
                  title="Delete the SearXNG install and set it up again from scratch"><i class="ph ph-arrow-clockwise ph-lead" aria-hidden="true"></i> Reinstall</button>
              </div>
              <p id="searxng-host-status" class="status" role="status"></p>
              <!-- Reported as web search "disabling itself". It was not the
                   setting: SearXNG is a container this app starts on demand,
                   and nothing brought it back after a reboot, so searches
                   fell through to DuckDuckGo, which rate-limits and answers
                   with an error. From outside, that is indistinguishable from
                   the switch having flipped.

                   Off by default. Starting a container is not something a
                   local-first app should do to a machine unasked, so this is a
                   thing you turn on once and then stop thinking about. -->
              <label class="setting-check searxng-autostart-row">
                <input type="checkbox" id="searxng-autostart">
                <span>Start SearXNG automatically when Tessellate opens</span>
              </label>
              <!-- An install runs for minutes. Without a bar and a live line
                   from the tool itself, slow and stuck look identical. -->
              <progress id="searxng-install-progress" class="install-progress hidden"
                max="1" aria-label="Install progress"></progress>
              <p class="muted install-line" id="searxng-install-line"></p>
              <!-- What the instance itself said. Its output used to go to
                   /dev/null, so a failed start could only ever be guessed at. -->
              <details id="searxng-output-fold" class="help-accordion hidden">
                <summary>What SearXNG reported</summary>
                <pre id="searxng-output" class="setup-snippet"></pre>
              </details>
            <details class="help-accordion searxng-diy">
              <summary>Prefer to run it yourself?</summary>
              <p class="muted">
                SearXNG is a separate service, so Tessellate runs it beside
                itself rather than inside itself. If you'd rather drive it
                yourself, it's a single command with Docker:
              </p>
              <pre class="setup-snippet">docker run -d --name searxng -p 8888:8080 \
  -e "SEARXNG_BASE_URL=http://localhost:8888/" \
  -v searxng:/etc/searxng searxng/searxng</pre>
              <p class="muted">
                It must return JSON, so add <code>- json</code> under
                <code>search.formats</code> in its <code>settings.yml</code>, then
                restart it. Come back here and hit <strong>Auto-detect</strong>, 
                Tessellate checks the usual ports and fills this in for you.
              </p>
            </details>
            </div>
            </div>

            <div class="settings-group" id="tasks-ai-group">

                  title="About autonomous background AI" aria-label="About autonomous background AI">
                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>
              </div>
              <p class="muted">Let the agent optimize your notes on its own, in the background.</p>
              <div class="help-body hidden" id="autonomous-ai-help" role="dialog" aria-label="About autonomous background AI">
                <p>
                  Have the agent automatically optimize your notes in the
                  background, tagging untagged notes, finding duplicates, and
                  linking related items.
                </p>
                <p>
                  With no model running, a note is filed by your other notes
                  and a built-in list of topics, and says why ("It mentions
                  squat (Fitness), like the 9 notes in Gym"). A note about
                  health, money, family, the law or identity is offered as a
                  choice instead, unless "File health, money and family notes

              </div>
              <label class="check-row">

              <!-- Asked for directly: "make the auto running of image

              </label>
              <!-- WORLD_CLASS_PLAN 23, decision 6: off by default, so a note
                   about health, money, family, the law or identity is offered
                   as a one-tap choice rather than filed by its words. -->
              <label class="check-row">
                <input type="checkbox" id="pref-auto-file-sensitive">
                <span>File health, money and family notes by their words too (off: they wait for you to choose)</span>
              </label>
              <!-- The owner, 2026-11-11: off by default. A filing under the

              <label class="check-row">
                <input type="checkbox" id="pref-ask-when-unsure">

              <!-- On by default. With this off, Save blocks until the model

              <label class="check-row">

              </label>
              <!-- INBOX 509, the owner's call made a switch: the search model

              <label class="check-row">
                <input type="checkbox" id="pref-auto-read-image-text">
                <span>Read text in images automatically (OCR and vision model)</span>
              </label>

              <div id="autonomous-settings-panel" class="settings-indent hidden">

                </label>

                  <input type="checkbox" id="pref-auto-link">

                </label>

                <!-- ANALYSIS.md §60 item 2. The hint is longer than its four
                     neighbours' on purpose: this is the only one of the five
                     that writes something *new* into the notebook off its own
                     judgement, and the two facts that make that acceptable
                     (drafts, and a tag you can filter and clear) are the two

                <label class="check-row">
                  <input type="checkbox" id="pref-auto-capture">
                  <span>
                    Capture things you mention in chat

                      After a chat, look back over what you said and save
                      anything worth keeping. Everything it finds arrives as a
                      draft tagged “auto-captured”, kept out of your notes list
                      and off the graph until you look at it, so a bad guess

                      write. Find them under Drafts.
                    </small>
                  </span>

              <p class="muted">Brings the notes, documents, boards and files changed on another computer into this notebook.</p>
              <div class="help-body hidden" id="sync-help" role="dialog" aria-label="About sync">
                <p>
                  Two ways, one result. Over the home network when both
                  computers are on the same network; through a folder (a USB
                  stick or a folder a sync tool keeps level) when they are not.
                  Press Sync on each computer to bring both level.
                </p>
                <p>
                  A note, document or board changed on both keeps the later
                  change, and the other words are kept in its History. A note
                  moved to the bin lands in the other computer's bin, and a
                  file removed on one is removed on the other.
                </p>
                <p>
                  To pair over the network, turn on other devices on the other
                  computer and type the address and password it shows there;
                  the first Pair names that computer's certificate, to check
                  against Other devices there, and the password goes only on
                  the second. It asks there before letting this one in. Removing it there
                  ends the pairing. The password is not kept. Pairing while
                  both notebooks are unlocked lets each open the other's
                  private notes, which stay encrypted on both.
                </p>
                <p>
                  Through a folder, each computer writes one encrypted file
                  there, locked with a passphrase you type each time (the same
                  on every computer; it is never kept). Private notes never go
                  into the folder, and a note made private after it was shared
                  is withdrawn from the other computer (kept there only if it
                  was changed there). A copied notebook folder has the same
                  sync id and is refused: on one copy, press Make a new sync id.
                  Computers paired with it then pair again.

            <!-- LAN mode (WORLD_CLASS_PLAN section 12, Brief 15): shown only

                 password through askPasswordPrompt, off asks for nothing.
                 Wired in settings-panes.js (`renderLanAccess`). -->
            <div class="settings-group">
              <div class="row help-head">
                <h3 data-synonyms="phone phones tablet lan wifi">Other devices</h3>
                <button type="button" class="icon-only ghost small graph-help-toggle"
                  data-help-for="lan-help" aria-controls="lan-help" aria-expanded="false"
                  title="About other devices" aria-label="About other devices">
                  <i class="ph ph-question" aria-hidden="true"></i>
                </button>
              </div>
              <div class="help-body hidden" id="lan-help" role="dialog" aria-label="About other devices">
                <p>
                  Off, only this computer can open the app: nothing on your
                  network can even reach it. On, a phone or another computer
                  on the same network can open it at the address shown here,
                  and always has to give your password, whatever this
                  computer is set to. Private notes still ask for it too.
                  Nothing installs on the phone: it is a browser window onto
                  this computer, where search, the models and the notes run.
                </p>
                <p>
                  Traffic on your network is encrypted (https, on its own
                  port, 8443 beside the usual 8000). The certificate is made
                  on this computer rather than bought from a company browsers
                  already trust, so the first time a device opens the address
                  it warns that the connection is not private.
                </p>
                <p>
                  Before you continue past that warning, open the
                  certificate's details on the other device and compare its
                  SHA-256 fingerprint with the one shown here. If they match,
                  continue, and that device will not ask again. If they do
                  not, stop: something else is answering at that address.
                  Regenerate certificate makes a new one, for example after
                  this computer's address changes; every device then warns
                  once more.
                </p>
                <p>
                  The change takes effect at once: turning it off signs every
                  other device out. Turning it on asks for your current
                  password, and resetting the password turns it off. Unused
                  for 14 days, it turns itself off and says so here.
                </p>
                <p>
                  The wifi icon in the status bar (Alt+L) shows the same at a
                  glance: open, closed on this network, or off. Its panel has
                  the switch, the address, and the networks: trusted ones with
                  Stop trusting and Forget, and the ones it stayed closed on
                  with Trust and Forget. Each new network the app sees is
                  listed there untrusted until you choose.
                </p>
                <p>
                  On a network you have not allowed, such as a cafe or an
                  airport, nothing can reach the notebook: turning this on
                  remembers the network you are on (by its router, read on
                  this computer), and anywhere else Settings and the bell
                  offer Allow on this network. A network Windows calls public
                  always asks. Allow on any network stops asking.
                </p>
                <p>
                  The first time a phone or computer signs in, it waits until
                  you choose Allow on this computer; allowed devices are
                  listed here with Remove, which also signs them out. Devices
                  outside your own network (a forwarded port) are never let
                  in. Loosening any of these asks for your password.
                </p>
                <p>
                  On Windows, if a phone connects once and then stops, the
                  firewall is blocking the port. The line shown below the
                  address opens it on private networks only; run it in a
                  Command Prompt opened as administrator.
                </p>
              </div>
              <label class="setting-check">
                <input type="checkbox" id="account-allow-lan">
                <span>
                  Allow other devices on this network
                  <small class="muted">They always need your password, over an encrypted connection.</small>
                </span>
              </label>
              <p id="account-lan-state" class="notice hidden" role="status"></p>
              <!-- INBOX 867: on a network nobody allowed, the LAN port stays
                   closed (core/lantrust.py) and this says so, with the one

                <div class="row button-row">
                  <button id="account-lan-allow-here" class="ghost small" type="button">Allow on this network</button>
                </div>
              </div>

              <div id="account-lan-addresses" class="lan-addresses hidden"></div>

                <pre id="account-lan-firewall-command" class="code-block"></pre>
                <div class="row">
                  <button type="button" id="account-lan-firewall-copy" class="ghost small"><i class="ph ph-copy ph-lead" aria-hidden="true"></i> Copy</button>
                </div>
              </div>
              <div id="account-lan-trust" class="hidden">
                <label class="setting-check">
                  <input type="checkbox" id="account-lan-ask" checked>
                  <span>
                    Ask before a new device signs in
                    <small class="muted">A phone's first sign-in waits until you choose Allow on this computer.</small>
                  </span>
                </label>
                <label class="setting-check">
                  <input type="checkbox" id="account-lan-any">
                  <span>
                    Allow on any network
                    <small class="muted">Off, other devices get in only on networks you allowed.</small>
                  </span>
                </label>
                <label class="setting-check">
                  <input type="checkbox" id="account-lan-plain">
                  <span>
                    Also allow plain http on this network
                    <small class="muted">Off, a phone typing the address without https is sent to https. On, anyone on this Wi-Fi can read your password and sign-in cookies.</small>
                  </span>
                </label>
                <p class="muted text-sm flush" id="account-lan-handshakes"></p>
                <div id="account-lan-pending-wrap" class="hidden">
                  <h4 class="setting-subhead">Waiting to sign in</h4>
                  <ul id="account-lan-pending" class="entry-list"></ul>
                </div>
                <h4 class="setting-subhead">Allowed devices</h4>
                <p class="muted small">A paired notebook keeps your key; Remove does not take it back.
                  <button type="button" class="icon-only ghost small graph-help-toggle"
                    data-help-for="account-lan-devices-help" aria-controls="account-lan-devices-help" aria-expanded="false"
                    title="What Remove does" aria-label="What Remove does">
                    <i class="ph ph-question" aria-hidden="true"></i>

                <div class="help-body hidden" id="account-lan-devices-help" role="dialog" aria-label="What Remove does">
                  <p>Remove signs a device out and ends a paired notebook's sync pass. A notebook you paired for sync was also given this notebook's data key, and a copy of a key cannot be revoked without a new one. Re-encrypt private notes makes a new key.</p>
                </div>
                <ul id="account-lan-devices" class="entry-list"></ul>
                <h4 class="setting-subhead">Trusted networks</h4>
                <ul id="account-lan-networks" class="entry-list"></ul>
                <!-- INBOX 896: networks it stayed closed on, and those you
                     stopped trusting, each with Trust (password) and Forget. -->

                  <ul id="account-lan-untrusted" class="entry-list"></ul>
                </div>
              </div>
              <button id="account-lan-restart" class="ghost small hidden" type="button">Restart now</button>
              <!-- The certificate LAN mode serves (core/lancert.py; SEC-08, the
                   owner's "Yes, self-signed HTTPS"): its fingerprint, to
                   compare with a phone's one-time warning, and a way to make
                   a new one. Shown once a certificate exists. -->
              <div id="account-lan-cert" class="hidden">
                <p class="muted text-sm flush">Certificate fingerprint (SHA-256), to compare with the warning on the other device:</p>
                <p class="lan-fingerprint flush" id="account-lan-fingerprint"></p>
                <p class="muted text-sm flush" id="account-lan-cert-names"></p>
                <p class="muted text-sm flush" id="account-lan-cert-expiry"></p>
                <p class="muted text-sm flush">Authority fingerprint, shown when the phone installs it:</p>
                <p class="lan-fingerprint flush" id="account-lan-authority"></p>
                <div class="row button-row">
                  <button id="account-lan-download" class="ghost small" type="button">Trust this certificate on your phone</button>
                  <button type="button" class="icon-only ghost small graph-help-toggle"
                    data-help-for="lan-trust-help" aria-controls="lan-trust-help" aria-expanded="false"
                    title="How to trust the certificate on a phone" aria-label="How to trust the certificate on a phone">
                    <i class="ph ph-question" aria-hidden="true"></i>
                  </button>
                  <button id="account-lan-regenerate" class="ghost small" type="button">Regenerate certificate</button>
                </div>
                <div class="help-body hidden" id="lan-trust-help" role="dialog" aria-label="How to trust the certificate on a phone">
                  <p>
                    Open this page on the phone, sign in, and press Trust this
                    certificate on your phone to download the certificate.
                  </p>
                  <p>
                    iPhone: open the address in Safari, press Install the
                    certificate on the lock screen (or the button here once
                    signed in), and choose Allow. Then, in the iPhone's own Settings
                    app, General, VPN and Device Management, Tessellate,
                    Install. Then General, About, Certificate Trust Settings,
                    and switch the certificate on for full trust.
                  </p>
                  <p>
                    Android: in the phone's own settings, open Security, then
                    Encryption and credentials, Install a certificate, CA
                    certificate, and pick the file.
                  </p>
                  <p>
                    The file is a small certificate authority made on this
                    computer, which can only vouch for addresses on your own
                    network. When this computer's address changes, the app
                    makes a new certificate under the same authority, so a
                    phone that trusts it is not asked again.
                  </p>
                  <p>
                    If the phone cannot connect at all, check that both are on
                    the same Wi-Fi (a guest network keeps devices apart), that
                    the address starts with https, and that this computer's
                    firewall lets the app in: Windows asks once, so choose
                    Private networks.
                  </p>
                  <p>
                    A phone's hotspot works too: join this computer to it, and
                    the app makes a certificate for the new address at once,
                    under the same authority. Bluetooth only carries a hotspot;
                    the app is a web page and cannot use it directly.
                  </p>

                   the console-hide mechanism itself changing from hiding an
                   already-created window to never creating one for User view
                   (see __main__.py's pythonw.exe relaunch): hiding one after
                   the fact turned out unreliable under some terminal setups. -->
              <label class="check-row hidden" id="desktop-console-row">
                <input type="checkbox" id="pref-show-console">
                <span>Dev view: keep a console window open</span>
              </label>
              <p class="muted hidden" id="desktop-console-hint">
                On by default. Turn it off for "User view", the app runs with
                no console window at all, just this app window and a system
                tray icon. You can also switch live from the tray icon's own
                menu, which remembers your choice for next time too, and the
                app briefly restarts itself when you switch this way.
              </p>
              <!-- Closing the window and quitting the app are two different
                   things on a desktop build with a tray icon, and until now the
                   app made that choice for you silently. Asked for directly:
                   "make it so the app window can be closed but the app will
                   still be open in the system tray… so there is a difference
                   between minimising the app and quitting the app". On by
                   default: a notebook you can capture into from the tray is
                   the reason the tray icon exists, and off for anyone who
                   wants the X button to mean what it says. -->
              <label class="check-row hidden" id="desktop-tray-row">
                <input type="checkbox" id="pref-close-to-tray">
                <span>Closing the window keeps Tessellate in the tray</span>
              </label>
              <p class="muted hidden" id="desktop-tray-hint">
                With this on, the X button hides the window and the app keeps
                running behind the tray icon, click it to bring the window
                back, or right-click → Quit to close it properly (which also
                stops any background work). With it off, closing the window
                quits.
              </p>
              <!-- The owner's decision: one running copy per notebook, and a
                   second launch brings its window forward. This switch is the
                   one exception, and only for windows: on, each launch opens
                   another window onto the SAME running server, never a second
                   server on the same data directory (core/instance_lock.py).
                   Folded under Advanced because almost nobody wants it, and
                   desktop-only like its neighbours. -->
              <details class="settings-fold hidden" id="desktop-advanced-fold">
                <summary>Advanced</summary>
                <label class="check-row">
                  <input type="checkbox" id="pref-new-window-on-launch">
                  <span>Open a new window on each launch</span>
                </label>
                <p class="muted">Off: launching again brings the open window forward. On: each launch opens another window onto the same running app.</p>
              </details>
              <!-- What changed, read from CHANGELOG.md rather than kept as a
                   second in-app list that would drift from it (§36E). Folded
                   shut: it is long, and About is not where you go to read it
                   unless you came looking. -->
              <details id="changelog-fold" class="settings-fold">
                <summary class="about-whats-new">What's new</summary>
                <div id="changelog-body" class="changelog-body"></div>
              </details>
            </div>

            <div class="settings-group">
              <h3>Get oriented</h3>
              <div class="row settings-row-spaced-6">
                <button id="about-take-tour" class="ghost small" type="button"><i class="ph ph-compass ph-lead" aria-hidden="true"></i> Take tour again</button>
                <!-- The Help page's own topics are one click further in than
                     this button already was, asked for directly, so the two
                     "how do I learn my way around" doors sit beside each
                     other instead of one being a whole nav click away. -->
                <button type="button" class="ghost small" data-goto-section="help"><i class="ph ph-question ph-lead" aria-hidden="true"></i> Open help &amp; guide</button>
              </div>
            </div>

            <div class="settings-group">
              <h3>Keyboard shortcuts</h3>
              <!-- This used to be a second, static list. Someone looking for
                   "how do I change a shortcut?" naturally opens Settings, so the
                   one place they look was the one place it couldn't be done. -->
              <p class="muted">
                Shortcuts can be changed and reset, press <kbd>?</kbd> any time,
                or open the list here.
              </p>
              <div class="row">
                <button id="about-shortcuts" class="ghost small" type="button"><i class="ph ph-keyboard ph-lead" aria-hidden="true"></i> Change keyboard shortcuts</button>
              </div>
            </div>
