<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture to Tessellate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Quick capture from anywhere (WORLD_CLASS_PLAN H9, row 27): what
       `memorymap --capture` opens, bound to a key in the system's own
       keyboard settings. One line, Enter saves, the window closes. Same
       origin as the app, so it signs in with the app's own token; no inline
       script. Every stylesheet the app links, as clip.html does. The stamps
       follow __version__ (tests/test_usage_ledger.py). -->
  <script src="/js/theme-boot.js?v=0.6.2"></script>
  <link rel="stylesheet" href="/vendor/phosphor/style.css">
  <link rel="stylesheet" href="/css/00-tokens-shell.css?v=0.6.2">
  <link rel="stylesheet" href="/css/01-forms-settings.css?v=0.6.2">
  <link rel="stylesheet" href="/css/02-chat-graph.css?v=0.6.2">
  <link rel="stylesheet" href="/css/03-dashboard-widgets.css?v=0.6.2">
  <link rel="stylesheet" href="/css/04-chat-dock-appearance.css?v=0.6.2">
  <link rel="stylesheet" href="/css/05-sidebars-themes.css?v=0.6.2">
  <link rel="stylesheet" href="/css/06-timeline-dialogs.css?v=0.6.2">
  <link rel="stylesheet" href="/css/07-whiteboard-misc.css?v=0.6.2">
  <link rel="stylesheet" href="/css/08-consistency.css?v=0.6.2">
  <link rel="stylesheet" href="/css/09-editor.css?v=0.6.2">
  <link rel="stylesheet" href="/css/10-responsive.css?v=0.6.2">
</head>
<body class="clip-page">
  <main class="clip-card" aria-labelledby="capture-heading">
    <h1 id="capture-heading" class="clip-heading">Capture to Tessellate</h1>
    <label class="visually-hidden" for="capture-text">Your note</label>
    <input id="capture-text" type="text" maxlength="2000" autocomplete="off" placeholder="A thought, a link, a reminder…">
    <p id="capture-status" class="status" role="status" aria-live="polite">Enter saves it, Escape closes.</p>
    <div class="row gap clip-actions">
      <button id="capture-save" type="button">Save</button>
      <button id="capture-close" type="button" class="ghost">Close</button>
      <a id="capture-open" class="ghost hidden" href="/" target="_blank" rel="noopener">Open Tessellate</a>
    </div>
  </main>
  <script src="/js/standalone-undo.js?v=0.6.2"></script>
  <script src="/js/capture.js?v=0.6.2"></script>
</body>
</html>
