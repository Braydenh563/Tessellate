# Minimal packaging config so `pip install -e .` makes the src/ layout
# importable everywhere (the simplest thing that works for a beginner:
# no PYTHONPATH fiddling on any OS).
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tessellate"
version = "0.6.1"
description = "Tessellate: a 100% offline, local-first AI notebook"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["notes", "notebook", "ai", "offline", "local-first", "ollama", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: News/Diary",
]

[project.urls]
Homepage = "https://github.com/Braydenh563/Tessellate"
Repository = "https://github.com/Braydenh563/Tessellate"
Issues = "https://github.com/Braydenh563/Tessellate/issues"
Changelog = "https://github.com/Braydenh563/Tessellate/blob/main/CHANGELOG.md"

[project.scripts]
tessellate = "tessellate.__main__:main"
memorymap = "tessellate.__main__:main"  # brand: keep (the command before the rename)

# Optional extras — install only the ones whose feature you want, e.g.
#   pip install -e ".[voice]"     # local Whisper dictation for the 🎙 buttons
#   pip install -e ".[desktop]"   # `python -m tessellate --desktop` app window
[project.optional-dependencies]
voice = ["faster-whisper"]
desktop = ["pywebview", "pystray", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]

# The taxonomy pack (ai/taxonomy.py) is JSON read from beside the module.
[tool.setuptools.package-data]
"tessellate.ai" = ["data/taxonomy/*.json", "data/skill_rates.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored third-party skills (MIT, see .claude/skills/README.md). Their Python
# is not ours to style: it lints with ~50 F401/F541/E402 findings, and CI runs
# `ruff check .` from the repo root, so without this exclusion pulling in an
# upstream update would fail the build for cosmetics in someone else's code.
# Vendored Python under src/tessellate/vendor is excluded for the same reason;
# docs/THIRD_PARTY.md lists every file there with its licence, and
# tests/test_vendor_manifest.py holds that list to the folder.
extend-exclude = [".claude/skills", "src/tessellate/vendor"]

[tool.ruff.lint]
# Ruff's default rules: pyflakes (F) + a curated pycodestyle subset (E). This
# is what CI enforces and the code is already clean under it. Line-length (E501)
# is intentionally left out — long strings/URLs in tests would flag noisily; run
# `ruff format` locally if you want wrapping.
# BLE001 (WORLD_CLASS_PLAN section 10, F4): a broad `except Exception` must
# re-raise, log with `exc_info`, or carry `# noqa: BLE001  # <reason>`,
# because a handler that says nothing turns a fault into silence (the
# "feature that never ran once" shape). Enabled 2026-09-26 at zero findings.
# T201 (WORLD_CLASS_PLAN 26.2, decision 57): `print` is for the command line
# (`__main__.py`, 25 calls) and for scripts; anything else in `src` goes to
# the logger. Measured 2026-10-10: no `print` in `src` outside `__main__.py`.
select = ["E4", "E7", "E9", "F", "BLE001", "T201"]

[tool.ruff.lint.per-file-ignores]
# T201 applies to `src` only; the command line there prints by design.
"!src/**" = ["T201"]
"src/tessellate/__main__.py" = ["T201"]
# `__all__` lists names this module resolves lazily through a PEP 562
# module `__getattr__` (see the comment above it) rather than binding them
# with a real import — the whole point being to not import the four split
# modules back at load time, which is what made this file part of a cyclic
# import. Pyflakes has no way to see through `__getattr__`, so every one of
# those names reads as undefined here; F822 is the tradeoff for that.
"src/tessellate/search/searxng_manager.py" = ["F822"]
